function getPath(obj, path, fallback) {
  const parts = path.split(".");
  let cur = obj;
  for (const p of parts) { if (cur == null) return fallback; cur = cur[p]; }
  return cur === undefined ? fallback : cur;
}
function setPath(obj, path, val) {
  const next = JSON.parse(JSON.stringify(obj || {}));
  const parts = path.split(".");
  let cur = next;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
  return next;
}

const API_BASE = window.AA_API_BASE || "http://localhost:8000";
async function apiFetch(path, options = {}, token) {
  const headers = { ...(options.headers || {}) };
  if (token) headers["Authorization"] = "Bearer " + token;
  if (options.body && !(options.body instanceof FormData) && !(options.body instanceof URLSearchParams) && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { ...options, headers });
  } catch (e) {
    throw new Error(`Không kết nối được tới backend tại ${API_BASE} — kiểm tra server đã chạy chưa.`);
  }
  if (!res.ok) {
    let detail = `Lỗi máy chủ (mã ${res.status})`;
    try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res;
}

function calcSalt(vung) {
  return SALT_VUNG.reduce((sum, v) => sum + v.w * (Number(getPath(vung, `${v.k}.b`, 0)) || 0) / 100, 0);
}
function mucDoFromSalt(score) {
  if (score <= 0) return "Không rụng tóc";
  if (score <= 20) return "Nhẹ/giới hạn";
  if (score <= 49) return "Trung bình";
  if (score <= 94) return "Nặng";
  return "Rất nặng";
}
function fmt(n) { return Math.round(n * 10) / 10; }
function mucDoSauDieuChinh(salt, yeuToNangBac) {
  const base = mucDoFromSalt(salt);
  const idx = MUC_DO_LEVELS.indexOf(base);
  if ((yeuToNangBac || []).length > 0 && idx < MUC_DO_LEVELS.length - 1) return MUC_DO_LEVELS[idx + 1];
  return base;
}

// ---------- kiểm tra "đã điền": mỗi mục phải có ít nhất 1 trường có giá trị ----------
function isFilled(v) {
  if (v == null) return false;
  if (typeof v === "string") return v.trim() !== "";
  if (typeof v === "number") return true;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "object") return Object.values(v).some(isFilled);
  return !!v;
}
function sectionFilled(data, keys) { return keys.some((k) => isFilled(data[k])); }
function allSectionsFilled(data, sectionMap) { return Object.values(sectionMap).every((keys) => sectionFilled(data, keys)); }

// ---------- ảnh: HEIC -> JPEG (nếu cần) -> resize -> WebP ----------
function isHeicFile(file) {
  return /\.hei[cf]$/i.test(file.name || "") || /^image\/hei[cf]/i.test(file.type || "");
}
async function toWebp(file, maxW = 900, q = 0.75, onStage) {
  let working = file;
  if (isHeicFile(file)) {
    onStage && onStage("Đang chuyển đổi HEIC...");
    try {
      const converted = await window.heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 });
      working = Array.isArray(converted) ? converted[0] : converted;
    } catch (e) {
      throw new Error("Không đọc được ảnh HEIC này — thử chụp lại hoặc chọn ảnh khác.");
    }
  }
  onStage && onStage("Đang nén WebP...");
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/webp", q));
      };
      img.onerror = () => reject(new Error("Không đọc được file ảnh này."));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(working);
  });
}
function dataUrlToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(",");
  const mime = (header.match(/data:(.*?);base64/) || [, "image/webp"])[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

const FieldMetaContext = React.createContext(null);
function FieldMetaProvider({ canManage, children }) {
  const [meta, setMeta] = useState(() => { try { return JSON.parse(lsGet("fieldMeta")?.value || "{}"); } catch (e) { return {}; } });
  const [editMode, setEditMode] = useState(false);
  const save = (label, data) => {
    const next = { ...meta, [label]: data };
    setMeta(next);
    lsSet("fieldMeta", JSON.stringify(next));
  };
  const remove = (label) => {
    const next = { ...meta }; delete next[label];
    setMeta(next);
    lsSet("fieldMeta", JSON.stringify(next));
  };
  return <FieldMetaContext.Provider value={{ meta, save, remove, canManage, editMode, setEditMode }}>{children}</FieldMetaContext.Provider>;
}
function FieldInfoPopover({ label, onClose }) {
  const ctx = React.useContext(FieldMetaContext);
  const existing = ctx.meta[label] || {};
  const [desc, setDesc] = useState(existing.desc || "");
  const [img, setImg] = useState(existing.img || "");
  const [busy, setBusy] = useState(false);
  const editing = ctx.canManage && ctx.editMode;

  const handleImg = async (file) => {
    setBusy(true);

        <button className="text-xs px-3 py-1 bg-teal-600 text-white rounded-md" onClick={() => { ctx.save(label, { desc, img }); onClose(); }}>Lưu</button>

function buildTreatmentSummary(d) {
  const chiTiet = (loai, khac, cuThe) => {
    let out = loai;
    if (loai === "Khác" && khac) out += ` (${khac})`;
    if (cuThe && String(cuThe).trim()) out += ` — ${String(cuThe).trim()}`;
    return out;
  };
  const parts = [];
  if (d.thuocUongCo === "Có" && d.thuocUongLoai) parts.push(`Thuốc uống: ${chiTiet(d.thuocUongLoai, d.thuocUongKhac, d.thuocUongCuThe)}`);
  if (d.thuocBoiCo === "Có" && d.thuocBoiLoai) parts.push(`Thuốc bôi: ${chiTiet(d.thuocBoiLoai, d.thuocBoiKhac, d.thuocBoiCuThe)}`);
  if (d.thuThuatCo === "Có" && d.thuThuatLoai) parts.push(`Thủ thuật: ${chiTiet(d.thuThuatLoai, d.thuThuatKhac, d.thuThuatCuThe)}`);
  return parts.join("; ");
}

// null      -> không chỉ định GPB (gpbCo !== "Có")

// "done"    -> đã có kết quả -> "Có GPB"
function gpbStatus(data) {
  if (!data || data.gpbCo !== "Có") return null;
  if (data.gpbKetQua && data.gpbKetQua.trim()) return { type: "done" };
  if (data.gpbNgayThucHien) {
    const ngay = new Date(data.gpbNgayThucHien + "T00:00:00");
    const homNay = new Date(todayISO() + "T00:00:00");
    const days = Math.max(0, Math.round((homNay - ngay) / 86400000));
    return { type: "waiting", days };
  }
  return null;
}
function GpbBadge({ data }) {
  const st = gpbStatus(data);
  if (!st) return null;
  if (st.type === "waiting") return <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs mr-1.5">Chờ GPB ({st.days})</span>;
  return <span className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-800 text-xs mr-1.5">Có GPB</span>;
}

// ---------- biểu đồ nhỏ, tự vẽ bằng SVG (không phụ thuộc thư viện ngoài) ----------
function MiniBarChart({ data, color = "#0F6E56" }) {
  if (!data || data.length === 0) return <div className="text-xs text-gray-400">Chưa có dữ liệu</div>;
  const max = Math.max(1, ...data.map((d) => d.value));
  const n = data.length;
  const chartW = 300, chartH = 130, barGap = 8;
  const barW = Math.max(14, chartW / n - barGap);
  return <svg viewBox={`0 0 ${chartW} 150`} style={{ width: "100%", maxHeight: 160 }}>
    {data.map((d, i) => {
      const x = i * (chartW / n) + (chartW / n - barW) / 2;
      const h = (d.value / max) * (chartH - 20);
      return <g key={d.label}>
        <rect x={x} y={chartH - h} width={barW} height={h} fill={color} rx="3" />
        <text x={x + barW / 2} y={chartH - h - 4} fontSize="10" textAnchor="middle" fill="#374151">{d.value}</text>
        <text x={x + barW / 2} y={chartH + 12} fontSize="9" textAnchor="middle" fill="#9CA3AF">{d.label}</text>
      </g>;
    })}
  </svg>;
}
function MiniPieChart({ data, size = 170 }) {
  if (!data || data.length === 0 || data.every((d) => d.value === 0)) return <div className="text-xs text-gray-400">Chưa có dữ liệu</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const colors = ["#0F6E56", "#D97706", "#2563EB", "#DC2626", "#7C3AED", "#059669"];
  let angle = 0;
  const cx = 70, cy = 70, r = 62;
  const slices = data.map((d, i) => {
    const frac = d.value / total;
    const start = angle, end = angle + frac * 2 * Math.PI; angle = end;
    const x1 = cx + r * Math.cos(start - Math.PI / 2), y1 = cy + r * Math.sin(start - Math.PI / 2);
    const x2 = cx + r * Math.cos(end - Math.PI / 2), y2 = cy + r * Math.sin(end - Math.PI / 2);
    const large = frac > 0.5 ? 1 : 0;
    return <path key={d.label} d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`} fill={colors[i % colors.length]} stroke="#fff" strokeWidth="1" />;
  });
  return <div className="flex items-center gap-4">
    <svg viewBox="0 0 140 140" style={{ width: size, height: size, flexShrink: 0 }}>{slices}</svg>
    <div className="text-sm space-y-1.5">
      {data.map((d, i) => <div key={d.label} className="flex items-center gap-1.5">
        <span style={{ width: 11, height: 11, borderRadius: "50%", background: colors[i % colors.length], display: "inline-block" }}></span>
        {d.label}: {d.value}
      </div>)}
    </div>
  </div>;
}

function Lightbox({ images, index, onClose, onPrev, onNext, onDelete }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); if (e.key === "ArrowLeft") onPrev(); if (e.key === "ArrowRight") onNext(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [index]);
  return <div className="lightbox" onClick={onClose}>
    <button onClick={onClose} className="absolute top-4 right-5 text-white text-2xl bg-transparent border-none cursor-pointer">×</button>
    <img src={images[index]} onClick={(e) => e.stopPropagation()} />
    <div className="flex items-center gap-4 mt-4" onClick={(e) => e.stopPropagation()}>
      <button className="bg-white/15 text-white rounded-md px-3 py-2 text-sm" onClick={onPrev} disabled={images.length < 2}>‹ Trước</button>
      <span className="text-white text-xs opacity-80">{index + 1} / {images.length}</span>
      <button className="bg-white/15 text-white rounded-md px-3 py-2 text-sm" onClick={onNext} disabled={images.length < 2}>Sau ›</button>
      <button className="bg-red-500/75 text-white rounded-md px-3 py-2 text-sm" onClick={() => { onDelete(index); onClose(); }}>Xoá ảnh này</button>
    </div>
  </div>;
}
function ImageUploader({ images, onChange, uploadImage }) {
  const [stage, setStage] = useState("");
  const [err, setErr] = useState("");
  const [lightboxIdx, setLightboxIdx] = useState(null);
  const handle = async (files) => {
    setErr("");
    const list = images || [];
    const next = [...list];
    for (const f of Array.from(files).slice(0, 8 - list.length)) {
      try {
        const webpDataUrl = await toWebp(f, 900, 0.75, setStage);
        if (uploadImage) {
          setStage("Đang tải ảnh lên máy chủ...");
          next.push(await uploadImage(dataUrlToBlob(webpDataUrl)));
        } else {
          next.push(webpDataUrl);
        }
      } catch (e) { setErr(e.message || "Có lỗi khi xử lý ảnh."); }
    }
    onChange(next);
    setStage("");
  };
  const del = (i) => onChange((images || []).filter((_, j) => j !== i));
  return <div>
    <div className="flex flex-wrap gap-2">
      <label className="px-3 py-1.5 bg-teal-600 text-white text-sm rounded-md hover:bg-teal-700 cursor-pointer">
        Chụp ảnh<input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handle(e.target.files)} />
      </label>
      <label className="px-3 py-1.5 bg-gray-100 text-gray-700 text-sm rounded-md hover:bg-gray-200 cursor-pointer">
        Chọn từ thư viện<input type="file" accept="image/*,.heic,.heif" multiple className="hidden" onChange={(e) => handle(e.target.files)} />
      </label>
    </div>
    {stage && <div className="text-xs text-gray-400 mt-1">{stage}</div>}
    {err && <div className="text-xs text-red-600 bg-red-50 rounded-md px-2 py-1 mt-1">{err}</div>}
    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-2">
      {(images || []).map((src, i) => (
        <div key={i} className="relative aspect-square rounded-md overflow-hidden border border-gray-200 cursor-pointer" onClick={() => setLightboxIdx(i)}>
          <img src={src} className="w-full h-full object-cover" />
          <span className="absolute bottom-1 left-1 bg-black/55 text-white text-[10px] px-1.5 rounded-full">{i + 1}</span>
          <button onClick={(e) => { e.stopPropagation(); del(i); }}
            className="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/55 text-white text-xs leading-none">×</button>
        </div>
      ))}
    </div>
    {lightboxIdx !== null && images.length > 0 &&
      <Lightbox images={images} index={lightboxIdx}
        onClose={() => setLightboxIdx(null)}
        onPrev={() => setLightboxIdx((lightboxIdx - 1 + images.length) % images.length)}
        onNext={() => setLightboxIdx((lightboxIdx + 1) % images.length)}
        onDelete={del} />}
  </div>;
}

function surveyValueText(key, value) {
  if (value === null || value === undefined || value === "") return null;
  if (value === true) return "Có";
  if (value === false) return null; // ô tích không chọn — coi như không có thông tin
  const s = String(value);
  if (key.indexOf("dlqi_") === 0 && DLQI_VALUE_LABELS[s]) return DLQI_VALUE_LABELS[s];
  return SURVEY_VALUE_LABELS[s] || s;
}

// Thanh "Đồng bộ thông tin từ phiếu khảo sát" — dùng chung cho cả 3 bệnh.
function SurveySyncBar({ benh, data, fetchSurvey, onApply }) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  async function run() {
    setBusy(true); setMsg(null);
    try {
      const r = await fetchSurvey(benh);
      if (!r.found) { setMsg({ ok: false, text: r.loi || "Hệ thống bệnh viện không có hồ sơ với mã bệnh nhân này." }); return; }
      if (!r.co_khao_sat) { setMsg({ ok: false, text: "Bệnh nhân có hồ sơ trên hệ thống bệnh viện nhưng CHƯA điền phiếu khảo sát." }); return; }
      const soTruong = Object.keys(r.mapped || {}).length;
      const daCoDuLieu = Object.keys(data || {}).some((k) => k !== "khaoSat" && k !== "khaoSatNgay" && k !== "khaoSatDlqiTong" && isFilled(data[k]));
      if (daCoDuLieu && !window.confirm(`Bệnh án này đã có dữ liệu.\n\nĐồng bộ sẽ GHI ĐÈ ${soTruong} trường bằng nội dung bệnh nhân tự khai trong phiếu khảo sát. Các trường khác giữ nguyên.\n\nTiếp tục?`)) return;
      onApply(r);
      setMsg({ ok: true, text: `Đã điền ${soTruong} trường từ phiếu khảo sát${r.ngay_kham ? ` ngày ${r.ngay_kham}` : ""}. Toàn bộ câu trả lời được lưu ở tab “Phiếu khảo sát”.` });
    } catch (e) {
      setMsg({ ok: false, text: e.message });
    } finally { setBusy(false); }
  }
  return <div className="mb-3 flex flex-wrap items-center gap-2">
    <button onClick={run} disabled={busy}
      className={`px-3 py-1.5 text-sm rounded-md ${busy ? "bg-gray-100 text-gray-400" : "bg-teal-50 text-teal-700 hover:bg-teal-100"}`}>
      {busy ? "Đang lấy phiếu khảo sát..." : "⟳ Đồng bộ thông tin từ phiếu khảo sát"}
    </button>
    {msg && <span className={`text-xs px-2.5 py-1 rounded-md ${msg.ok ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"}`}>{msg.text}</span>}
  </div>;
}

// Áp bảng ánh xạ (dạng phẳng "đường.dẫn": giá trị) từ phiếu khảo sát vào dữ liệu bệnh án.
function applySurveyToData(prev, r) {
  let next = { ...(prev || {}), khaoSat: r.khao_sat, khaoSatNgay: r.ngay_kham || null, khaoSatDlqiTong: r.dlqi_tong };
  Object.keys(r.mapped || {}).forEach((path) => { next = setPath(next, path, r.mapped[path]); });
  return next;
}

// Tab "Phiếu khảo sát" cố ý KHÔNG nằm trong bảng kiểm tra "đã điền" (NEW_*_SECTIONS) —
// bệnh án vẫn phải hoàn thiện được kể cả khi bệnh nhân không điền phiếu.
const EXTRA_TAB_KEYS = { "Phiếu khảo sát": ["khaoSat"] };
function tabKeys(sectionMap, name) { return sectionMap[name] || EXTRA_TAB_KEYS[name] || []; }

// ---------- Nút tròn "điền nhanh": điền 1 đáp án cho mọi câu Có/Không CÒN TRỐNG của mục đang mở ----------
// Không bao giờ ghi đè câu bác sĩ đã trả lời — chỉ đụng vào ô còn trống.
const YESNO3 = ["Có", "Không", "Không biết"];
const YESNO2 = ["Có", "Không"];
// bảng Tiền sử (YesNoUnknownTable): mỗi dòng là <gốc>.<tên dòng>.status
function tsTargets(rows, root, options = YESNO3) { return rows.map((r) => ({ path: `${root}.${r}.status`, options })); }
// Dermoscopy: mỗi dấu hiệu là dermoscopy.<tên dấu hiệu>
function dermTargets(items) { return items.map((i) => ({ path: `dermoscopy.${i}`, options: YESNO2 })); }

function applyQuickFill(data, targets, val) {
  let next = data, n = 0;
  (targets || []).forEach((t) => {
    if (!t.options.includes(val)) return;
    if (isFilled(getPath(next, t.path))) return;
    next = setPath(next, t.path, val); n++;
  });
  return { next, n };
}

function QuickFillButton({ targets, onApply }) {
  const [open, setOpen] = useState(false);
  const [msg, setMsg] = useState("");
  if (!targets || targets.length === 0) return null;
  const options = [];
  targets.forEach((t) => t.options.forEach((o) => { if (options.indexOf(o) < 0) options.push(o); }));
  const run = (v) => {
    const n = onApply(v);
    setOpen(false);
    setMsg(n > 0 ? `Đã điền “${v}” cho ${n} câu còn trống` : "Mục này không còn câu nào trống");
    setTimeout(() => setMsg(""), 4000);
  };
  return <div className="ml-auto relative flex items-center gap-2">
    {msg && <span className="text-xs text-emerald-700 bg-emerald-50 rounded-md px-2 py-1 whitespace-nowrap">{msg}</span>}
    <button type="button" onClick={() => setOpen(!open)}
      title="Điền nhanh các câu Có/Không còn trống trong mục đang mở"
      className="w-9 h-9 rounded-full border border-teal-300 bg-teal-50 text-teal-700 hover:bg-teal-100 text-base leading-none flex items-center justify-center">⚡</button>
    {open && <div className="absolute right-0 top-11 z-20 w-60 bg-white border border-gray-200 rounded-md shadow-lg py-1">
      <div className="px-3 py-1 text-[11px] text-gray-400">Điền cho {targets.length} câu của mục này (chỉ câu còn trống)</div>
      {options.map((v) => (
        <button key={v} type="button" onClick={() => run(v)} className="w-full text-left px-3 py-1.5 text-sm hover:bg-gray-50">{v}</button>
      ))}
      <button type="button" onClick={() => setOpen(false)} className="w-full text-left px-3 py-1.5 text-xs text-gray-400 hover:bg-gray-50 border-t border-gray-100">Đóng</button>
    </div>}
  </div>;
}

function LoginScreen({ onLogin }) {
  const [u, setU] = useState(""); const [p, setP] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async () => {
    setErr(""); setBusy(true);

    try { await onLogin(u.trim(), p); } catch (e) { setErr(e.message || "Sai tên đăng nhập hoặc mật khẩu"); }
    setBusy(false);
  };
  return <div className="bg-white border border-gray-200 rounded-lg p-6 max-w-sm mx-auto mt-10">
    <div className="text-lg font-medium mb-4">Đăng nhập hệ thống bệnh án AA</div>
    <Field label="Tên đăng nhập"><TextInput value={u} onChange={setU} onEnter={submit} /></Field>
    <Field label="Mật khẩu"><TextInput type="password" value={p} onChange={setP} onEnter={submit} /></Field>
    {err && <div className="text-red-600 text-xs mb-2">{err}</div>}
    <button className="w-full px-4 py-2 bg-teal-600 text-white text-sm rounded-md hover:bg-teal-700" onClick={submit} disabled={busy}>{busy ? "Đang đăng nhập..." : "Đăng nhập"}</button>
  </div>;
}

function ChangePasswordScreen({ onSubmit, onCancel }) {
  const [oldPw, setOldPw] = useState(""); const [newPw, setNewPw] = useState(""); const [confirmPw, setConfirmPw] = useState("");
  const [err, setErr] = useState(""); const [ok, setOk] = useState(false); const [busy, setBusy] = useState(false);
  const submit = async () => {
    setErr(""); setOk(false);
    if (newPw.length < 6) { setErr("Mật khẩu mới phải có ít nhất 6 ký tự"); return; }
    if (newPw !== confirmPw) { setErr("Xác nhận mật khẩu mới không khớp"); return; }
    setBusy(true);
    try {
      await onSubmit(oldPw, newPw);
      setOk(true); setOldPw(""); setNewPw(""); setConfirmPw("");
    } catch (e) { setErr(e.message || "Có lỗi xảy ra"); }
    setBusy(false);
  };
  return <div className="bg-white border border-gray-200 rounded-lg p-6 max-w-sm mx-auto mt-10">
    <div className="text-lg font-medium mb-4">Đổi mật khẩu</div>
    <Field label="Mật khẩu hiện tại"><TextInput type="password" value={oldPw} onChange={setOldPw} /></Field>
    <Field label="Mật khẩu mới (tối thiểu 6 ký tự)"><TextInput type="password" value={newPw} onChange={setNewPw} /></Field>
    <Field label="Xác nhận mật khẩu mới"><TextInput type="password" value={confirmPw} onChange={setConfirmPw} /></Field>
    {err && <div className="text-red-600 text-xs mb-2">{err}</div>}
    {ok && <div className="text-teal-700 text-xs mb-2 bg-teal-50 rounded-md px-2 py-1.5">Đổi mật khẩu thành công. Lần đăng nhập sau dùng mật khẩu mới.</div>}
    <div className="flex gap-2">
      <button className="flex-1 px-4 py-2 bg-teal-600 text-white text-sm rounded-md hover:bg-teal-700" onClick={submit} disabled={busy}>{busy ? "Đang xử lý..." : "Đổi mật khẩu"}</button>
      <button className="px-4 py-2 bg-gray-100 text-gray-600 text-sm rounded-md hover:bg-gray-200" onClick={onCancel}>Đóng</button>
    </div>
  </div>;
}

      <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={d.can_export} onChange={(e) => setD({ ...d, can_export: e.target.checked })} />Được xuất dữ liệu</label>

// ---------- thiết kế mẫu bệnh án nghiên cứu (mục -> trường, có trường tự tính công thức) ----------
function extractDeps(formula, knownIds) {
  if (!formula) return [];
  const tokens = formula.match(/[a-zA-Z_][a-zA-Z0-9_]*/g) || [];
  return Array.from(new Set(tokens.filter((t) => knownIds.includes(t))));
}
function evalFormula(formula, values) {
  if (!formula) return null;
  const allowed = /^[a-zA-Z0-9_+\-*/().\s]*$/;
  if (!allowed.test(formula)) return null;
  let expr = formula;
  Object.keys(values).sort((a, b) => b.length - a.length).forEach((id) => {
    const re = new RegExp(`\\b${id}\\b`, "g");
    expr = expr.replace(re, `(${Number(values[id]) || 0})`);
  });
  try { return Function(`"use strict";return (${expr})`)(); } catch (e) { return null; }
}
const FIELD_TYPE_LABELS = { text: "Văn bản", number: "Số", date: "Ngày", single: "1 lựa chọn", multi: "Nhiều lựa chọn", note: "Mô tả biến số", computed: "Tự tính (công thức)" };

function DynamicFormPreview({ sections }) {
  const [values, setValues] = useState({});
  const set = (id, v) => setValues((prev) => ({ ...prev, [id]: v }));
  const allVarCodes = sections.flatMap((s) => s.fields.filter((f) => f.varCode).map((f) => f.varCode));
  const numericValues = {};
  sections.forEach((s) => s.fields.forEach((f) => { if (f.varCode) numericValues[f.varCode] = Number(values[f.varCode]) || 0; }));

  return <div>
    {sections.map((s) => <div key={s.id} className="mb-4">
      <div className="text-sm font-medium text-gray-700 mb-2">{s.title}</div>
      {s.fields.map((f) => {
        const opts = (f.options || "").split(",").map((x) => x.trim()).filter(Boolean);
        const key = f.varCode || f.id;
        if (f.type === "note") return <div key={f.id} className="text-xs text-gray-500 italic mb-2 border-l-2 border-gray-200 pl-2">{f.label}</div>;
        if (f.type === "computed") {
          const deps = extractDeps(f.formula, allVarCodes);
          const result = evalFormula(f.formula, numericValues);
          return <div key={f.id} className="mb-2">
            <div className="text-xs text-gray-600 mb-1">{f.label}</div>
            <span className="px-2 py-0.5 rounded-full bg-teal-50 text-teal-800 text-xs">{result === null ? "—" : fmt(result)}</span>
            <span className="text-xs text-gray-400 ml-2">Phụ thuộc vào: {deps.join(", ") || "(chưa xác định — kiểm tra lại mã biến trong công thức)"}</span>
          </div>;
        }
        return <Field key={f.id} label={f.label}>
          {f.type === "text" && <TextInput value={values[key]} onChange={(v) => set(key, v)} />}
          {f.type === "number" && <TextInput type="number" value={values[key]} onChange={(v) => set(key, v)} />}
          {f.type === "date" && <TextInput type="date" value={values[key]} onChange={(v) => set(key, v)} />}
          {f.type === "single" && <RadioGroup options={opts} value={values[key]} onChange={(v) => set(key, v)} />}
          {f.type === "multi" && <CheckboxGroup options={opts} value={values[key]} onChange={(v) => set(key, v)} />}
        </Field>;
      })}
    </div>)}
    {sections.every((s) => s.fields.length === 0) && <div className="text-sm text-gray-400">Chưa có trường nào — thêm trường ở khung bên trên để xem thử tại đây.</div>}
  </div>;
}

function FormBuilderScreen() {
  const [templates, setTemplates] = useState(() => { try { return JSON.parse(lsGet("formTemplates")?.value || "[]"); } catch (e) { return []; } });
  const [editing, setEditing] = useState(null);

  function persist(next) { setTemplates(next); lsSet("formTemplates", JSON.stringify(next)); }
  function newTemplate() { setEditing({ id: "tpl_" + Date.now(), name: "Mẫu mới", sections: [{ id: "s_" + Date.now(), title: "Hành chính", fields: [] }] }); }
  function saveCurrent() {
    const idx = templates.findIndex((t) => t.id === editing.id);
    const next = idx >= 0 ? templates.map((t) => (t.id === editing.id ? editing : t)) : [...templates, editing];
    persist(next);
  }
  function updateEditing(fn) { setEditing((prev) => fn(JSON.parse(JSON.stringify(prev)))); }
  function addSection() { updateEditing((t) => { t.sections.push({ id: "s_" + Date.now(), title: "Mục mới", fields: [] }); return t; }); }
  function removeSection(sid) { updateEditing((t) => { t.sections = t.sections.filter((s) => s.id !== sid); return t; }); }
  function addField(sid) { updateEditing((t) => { t.sections.find((s) => s.id === sid).fields.push({ id: "f_" + Date.now() + Math.random().toString(36).slice(2, 6), varCode: "", label: "Câu hỏi mới", type: "text", options: "", formula: "" }); return t; }); }
  function removeField(sid, fid) { updateEditing((t) => { const s = t.sections.find((x) => x.id === sid); s.fields = s.fields.filter((f) => f.id !== fid); return t; }); }
  function updateField(sid, fid, patch) { updateEditing((t) => { const f = t.sections.find((x) => x.id === sid).fields.find((x) => x.id === fid); Object.assign(f, patch); return t; }); }

  if (!editing) {
    return <div className="bg-white border border-gray-200 rounded-lg p-5">
      <div className="font-medium mb-3">Các mẫu bệnh án đã thiết kế</div>
      <button className="px-4 py-1.5 bg-teal-600 text-white text-sm rounded-md mb-3" onClick={newTemplate}>+ Tạo mẫu mới</button>
      <div className="divide-y divide-gray-100">
        {templates.map((t) => <button key={t.id} className="w-full text-left py-2 text-sm hover:bg-gray-50" onClick={() => setEditing(JSON.parse(JSON.stringify(t)))}>{t.name} <span className="text-gray-400">({t.sections.length} mục)</span></button>)}
        {templates.length === 0 && <div className="text-sm text-gray-400 py-2">Chưa có mẫu nào — bấm "Tạo mẫu mới" để bắt đầu (ví dụ thiết kế mẫu AGA).</div>}
      </div>
    </div>;
  }

  const allVarCodes = editing.sections.flatMap((s) => s.fields.filter((f) => f.varCode).map((f) => f.varCode));

  return <div className="space-y-4">
    <div className="bg-white border border-gray-200 rounded-lg p-5">
      <Field label="Tên mẫu bệnh án"><TextInput value={editing.name} onChange={(v) => updateEditing((t) => { t.name = v; return t; })} /></Field>
      {editing.sections.map((s) => <div key={s.id} className="border border-gray-200 rounded-md p-3 mb-3">
        <div className="flex items-center gap-2 mb-2">
          <input className="flex-1 border-b border-gray-300 text-sm font-medium py-1 focus:outline-none" value={s.title}
            onChange={(e) => updateEditing((t) => { t.sections.find((x) => x.id === s.id).title = e.target.value; return t; })} />
          <button className="text-xs text-red-600 whitespace-nowrap" onClick={() => removeSection(s.id)}>Xoá mục</button>
        </div>
        {s.fields.map((f) => <div key={f.id} className="grid sm:grid-cols-6 gap-2 items-start mb-2 text-xs bg-gray-50 rounded-md p-2">
          <input className="sm:col-span-2 border border-gray-300 rounded px-2 py-1" placeholder="Nhãn câu hỏi" value={f.label} onChange={(e) => updateField(s.id, f.id, { label: e.target.value })} />
          <input className="border border-gray-300 rounded px-2 py-1" placeholder="Mã biến (vd: dinh)" value={f.varCode} onChange={(e) => updateField(s.id, f.id, { varCode: e.target.value.replace(/[^a-zA-Z0-9_]/g, "") })} />
          <select className="border border-gray-300 rounded px-2 py-1" value={f.type} onChange={(e) => updateField(s.id, f.id, { type: e.target.value })}>
            {Object.entries(FIELD_TYPE_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
          {(f.type === "single" || f.type === "multi") && <input className="sm:col-span-2 border border-gray-300 rounded px-2 py-1" placeholder="Các lựa chọn, cách nhau bằng dấu phẩy" value={f.options} onChange={(e) => updateField(s.id, f.id, { options: e.target.value })} />}
          {f.type === "computed" && <input className="sm:col-span-2 border border-gray-300 rounded px-2 py-1" placeholder="Công thức, vd: dinh*0.4+cham*0.24" value={f.formula} onChange={(e) => updateField(s.id, f.id, { formula: e.target.value })} />}
          {f.type === "computed" && <div className="sm:col-span-6 text-gray-400">Phụ thuộc vào: {extractDeps(f.formula, allVarCodes).join(", ") || "(chưa xác định)"}</div>}
          <button className="text-red-600 text-right" onClick={() => removeField(s.id, f.id)}>Xoá trường</button>
        </div>)}
        <button className="text-xs text-teal-700" onClick={() => addField(s.id)}>+ Thêm trường</button>
      </div>)}
      <button className="text-sm text-teal-700" onClick={addSection}>+ Thêm mục</button>
      <div className="flex gap-2 mt-4 pt-3 border-t border-gray-200">
        <button className="px-4 py-2 bg-teal-600 text-white text-sm rounded-md" onClick={saveCurrent}>Lưu mẫu</button>
        <button className="px-4 py-2 bg-gray-100 text-sm rounded-md" onClick={() => setEditing(null)}>Đóng (không lưu)</button>
      </div>
    </div>

    <div className="bg-white border border-gray-200 rounded-lg p-5">
      <div className="font-medium mb-3">Xem thử biểu mẫu</div>
      <DynamicFormPreview sections={editing.sections} />
    </div>
  </div>;
}

function App() {

  const [editIdx, setEditIdx] = useState(null);

  const [gpbWaitlist, setGpbWaitlist] = useState([]);
  const [searchFilters, setSearchFilters] = useState({ tenBN: "", tuNgay: "", denNgay: "", benh: "", dieuTriChua: "", xetNghiemCo: "", chiChuaDien: false, soLuotTaiKhamItNhat: "" });
  const [searchResults, setSearchResults] = useState(null);
  const [todayFilter, setTodayFilter] = useState("");
  const [chartStats, setChartStats] = useState({ visitType: [], disease: [] });
  const [hisMsg, setHisMsg] = useState(null); // trạng thái tra cứu hệ thống bệnh viện
  const [patientDraft, setPatientDraft] = useState(null); // bản nháp khi sửa thông tin hành chính

  const draftRef = useRef(null);

  useEffect(() => { if (user) { loadToday(); loadGpbWaitlist(); } }, [user]);

  async function login(username, password) {
    const form = new URLSearchParams(); form.set("username", username); form.set("password", password);
    const data = await apiFetch("/auth/login", { method: "POST", body: form });
    const u = { username, display_name: data.display_name, role: data.role, can_create: data.can_create, can_export: data.can_export, can_manage_fields: data.can_export, is_admin: data.is_admin, token: data.access_token };
    ssSet("aa_user", JSON.stringify(u)); setUser(u);
  }
  function logout() { ssRemove("aa_user"); setUser(null); setView("home"); }
  // Không còn ở trong phiếu nào thì xoá bản nháp, tránh lưu nhầm sang hồ sơ khác
  useEffect(() => { if (view !== "newCase" && view !== "followup") draftRef.current = null; }, [view]);
  async function changePassword(oldPw, newPw) {
    await api("/auth/change-password", { method: "POST", body: JSON.stringify({ old_password: oldPw, new_password: newPw }) });
  }
  function api(path, options) { return apiFetch(path, options, user?.token); }
  async function listDoctors() { return api("/admin/doctors"); }
  async function createDoctor(d) {
    return api("/admin/doctors", { method: "POST", body: JSON.stringify(d) });
  }
  async function updateDoctorPermissions(username, patch) {
    return api(`/admin/doctors/${encodeURIComponent(username)}`, { method: "PUT", body: JSON.stringify(patch) });
  }
  async function resetDoctorPassword(username, newPassword) {
    return api(`/admin/doctors/${encodeURIComponent(username)}/reset-password`, { method: "POST", body: JSON.stringify({ new_password: newPassword }) });
  }
  async function deleteDoctor(username) {
    return api(`/admin/doctors/${encodeURIComponent(username)}`, { method: "DELETE" });
  }
  // Gọi phiếu khảo sát của bệnh nhân trên hệ thống bệnh viện (qua backend để tránh CORS).
  function loadSurvey(benh) {
    return api(`/survey/${encodeURIComponent(patient.maBN)}${benh ? `?benh=${encodeURIComponent(benh)}` : ""}`);
  }
  // Tự lấy họ tên + ngày sinh khi mã bệnh nhân chưa có trong phần mềm.
  async function lookupHIS(maBN, apply) {
    const applyTo = apply || setPatient;
    setHisMsg({ ok: true, text: "Đang tra cứu hệ thống bệnh viện..." });
    try {
      const r = await api(`/survey/${encodeURIComponent(maBN)}`);
      if (!r.found) { setHisMsg({ ok: false, text: r.loi || "Hệ thống bệnh viện không có hồ sơ với mã này — nhập tay bên dưới." }); return; }
      applyTo((prev) => ({
        ...prev,
        maBN: r.ma_bn || prev.maBN,
        hoTen: r.ho_ten || prev.hoTen,
        ngaySinh: r.ngay_sinh || prev.ngaySinh,
        namSinh: r.nam_sinh || prev.namSinh,
        gioiTinh: r.gioi_tinh || prev.gioiTinh,
      }));
      setHisMsg({ ok: true, text: `Đã lấy họ tên và ngày sinh từ hệ thống bệnh viện — bệnh nhân ${r.co_khao_sat ? "ĐÃ" : "CHƯA"} điền phiếu khảo sát.` });
    } catch (e) { setHisMsg({ ok: false, text: "Không tra cứu được: " + e.message }); }
  }

  async function uploadImage(blob) {
    const form = new FormData();
    form.append("file", blob, "photo.webp");
    const res = await api(`/images/upload?ma_bn=${encodeURIComponent(patient.maBN)}`, { method: "POST", body: form });
    return res.url.startsWith("/") ? API_BASE + res.url : res.url;
  }

  async function loadToday() {
    const res = await api("/dashboard/today");
    const out = res.danh_sach.map((r) => ({
      loai: r.loai, maBN: r.ma_bn, hoTen: r.ho_ten, maLuuTru: r.ma_luu_tru, benh: r.benh,
      daDienDuLieu: !!r.da_dien_du_lieu, followupId: r.followup_id,
      record: { dieuTri: r.dieu_tri, gpbCo: r.gpb_co, gpbNgayThucHien: r.gpb_ngay_thuc_hien, gpbKetQua: r.gpb_ket_qua, hasAnh: r.has_anh },
    }));
    setToday(out);
    let newCount = 0, followupCount = 0;
    res.danh_sach.forEach((r) => { if (r.loai === "Bệnh án mới") newCount++; else followupCount++; });
    const diseaseCounts = {};
    res.danh_sach.forEach((r) => { diseaseCounts[r.benh || "AA"] = (diseaseCounts[r.benh || "AA"] || 0) + 1; });
    setChartStats({
      visitType: [{ label: "Khám mới", value: newCount }, { label: "Tái khám", value: followupCount }],
      disease: Object.keys(diseaseCounts).map((k) => ({ label: k, value: diseaseCounts[k] })),
    });
  }
  async function loadGpbWaitlist() {

  async function runSearch() {
    const f = searchFilters;
    const params = new URLSearchParams();
    if (f.tenBN) params.set("ten_bn", f.tenBN);
    if (f.tuNgay) params.set("tu_ngay", f.tuNgay);
    if (f.denNgay) params.set("den_ngay", f.denNgay);

      loai: r.loai, maBN: r.ma_bn, hoTen: r.ho_ten, maLuuTru: r.ma_luu_tru, ngay: r.ngay, benh: r.benh,
      mucDo: r.muc_do_nang, daDienDuLieu: !!r.da_dien_du_lieu, followupId: r.followup_id, soLuotTK: r.so_luot_tai_kham,
      record: { gpbCo: r.gpb_co, gpbNgayThucHien: r.gpb_ngay_thuc_hien, gpbKetQua: r.gpb_ket_qua, hasAnh: r.has_anh },
    })));

  async function handleSearch() {
    const typed = maBNInput.trim(); if (!typed) return;
    try {
      const p = await api(`/patients/${encodeURIComponent(typed)}`);
      const pp = mapPatientFromApi(p);
      setPatient(pp);
      // dùng đúng mã BN thật (có thể có số 0 ở đầu) trả về từ backend, không dùng lại mã đã gõ tắt
      // Thử lần lượt từng bệnh — bệnh nhân có thể đã có hồ sơ AA hoặc AGA (chưa hỗ trợ 2 bệnh cùng lúc)
      try {
        const c = await api(`/cases/${encodeURIComponent(pp.maBN)}/aa`);
        setAaCase(mapCaseFromApi(c)); setCurrentDisease("aa"); setView("timeline"); return;
      } catch (e) {}
      try {
        const c = await api(`/cases/${encodeURIComponent(pp.maBN)}/aga`);
        setAaCase(mapCaseFromApi(c)); setCurrentDisease("aga"); setView("timeline"); return;
      } catch (e) {}
      try {
        const c = await api(`/cases/${encodeURIComponent(pp.maBN)}/nonscar`);
        setAaCase(mapCaseFromApi(c)); setCurrentDisease("nonscar"); setView("timeline"); return;
      } catch (e) {}
      setAaCase(null); setView("chooseDisease");
    } catch (e) { setPatient({ maBN: typed }); setAaCase(null); setHisMsg(null); setView("newPatient"); lookupHIS(typed); }
  }
  async function openRecord(row) {
    const p = await api(`/patients/${encodeURIComponent(row.maBN)}`);
    setPatient(mapPatientFromApi(p));
    const diseasePath = (row.benh || "AA").toLowerCase();
    const c = await api(`/cases/${encodeURIComponent(row.maBN)}/${diseasePath}`);
    const cc = mapCaseFromApi(c); setAaCase(cc); setCurrentDisease(diseasePath);
    if (row.followupId === null) { setView("newCase"); }
    else { const idx = cc.taiKhams.findIndex((tk) => tk.id === row.followupId); setEditIdx(idx >= 0 ? idx : 0); setView("followup"); }
  }

    return { ma_bn: p.maBN, ho_ten: p.hoTen, gioi_tinh: p.gioiTinh, nam_sinh: p.namSinh ? Number(p.namSinh) : null,

  // ---------- xuất Excel thật (.xlsx) — tránh hoàn toàn lỗi font/dấu phân tách của CSV ----------
  function downloadXlsx(sheetName, headers, rows, filename) {
    const ws = window.XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws["!cols"] = headers.map((h) => ({ wch: Math.min(28, Math.max(10, String(h).length + 2)) }));
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
    window.XLSX.writeFile(wb, filename);
  }

  // trải phẳng 1 bản ghi (bệnh án mới hoặc 1 lần tái khám) thành {đường dẫn kỹ thuật: giá trị}
  // Lưu ý: cột "anh" KHÔNG đưa dữ liệu ảnh (base64/URL) vào Excel — quá dài, vượt giới hạn
  // 32.767 ký tự/ô của Excel và làm hỏng cả file. Chỉ ghi số lượng ảnh để tham khảo.
  function flattenRecord(obj, prefix, out) {
    for (const key in (obj || {})) {
      const value = obj[key];
      if (value == null || value === "") continue;
      const path = prefix ? `${prefix}.${key}` : key;
      if (key === "anh") continue; // bỏ hẳn cột hình ảnh khỏi file xuất
      if (Array.isArray(value)) out[path] = value.join("; ");
      else if (typeof value === "object") flattenRecord(value, path, out);
      else out[path] = String(value).length > 30000 ? String(value).slice(0, 30000) + " …(cắt bớt, quá dài cho 1 ô Excel)" : value;
    }
    return out;
  }

  // đặt tên cột theo quy ước: 0_HC, 1_BSTS, 2_Kham, 3_SALT, 4_Dermoscopy, 5_CLS, 6_Dieutri, 7_Anh + tên trường không dấu viết liền

    coNangDaDau: "2_Kham", vongBung: "2_Kham", batThuongCoQuan: "2_Kham", viTriRungToc: "2_Kham",

    vungTocThua: "2_Kham", mongBatThuong: "2_Kham", rungLongMayMi: "2_Kham",
    dauHieuCuongAndrogen: "2_Kham", phanBoRungToc: "2_Kham", matDoToc: "2_Kham", duongKinhSoiToc: "2_Kham",
    hamiltonNorwood: "3_ThangDiem", sinclairScale: "3_ThangDiem", ludwig: "3_ThangDiem", pcos: "3_ThangDiem",
    sieuAmOBung: "5_CLS", testNhanhGiangMai: "5_CLS", xnKhac: "5_CLS",
    hairArea: "4_Dermoscopy", hairCountGeneral: "4_Dermoscopy", hairDensityGeneral: "4_Dermoscopy",
    hairCountRelevant: "4_Dermoscopy", hairDensityRelevant: "4_Dermoscopy",
    hairRateAnagen: "4_Dermoscopy", hairRateTelogen: "4_Dermoscopy", meanLength: "4_Dermoscopy",
    hairCountAnagen: "4_Dermoscopy", hairCountTelogen: "4_Dermoscopy", hairDensityAnagen: "4_Dermoscopy", hairDensityTelogen: "4_Dermoscopy",
    hairRateTerminal: "4_Dermoscopy", hairRateVellus: "4_Dermoscopy", meanThickness: "4_Dermoscopy",
    hairCountTerminal: "4_Dermoscopy", hairCountVellus: "4_Dermoscopy", hairDensityTerminal: "4_Dermoscopy", hairDensityVellus: "4_Dermoscopy",
    cumulativeThickness: "4_Dermoscopy", dermoscopyKhac: "4_Dermoscopy",
    vungTran: "4_Dermoscopy", vungDinh: "4_Dermoscopy", vungCham: "4_Dermoscopy",
  };
  const CONTAINER_ABBR = { vung: null, dermoscopy: null, labs: null, tdkm: "tdkm", tienSuBanThan: "tsbt", tienSuGiaDinh: "tsgd", khaoSat: null };
  function stripDiacritics(s) {
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
  }
  function slugSegment(s) { return stripDiacritics(s).toLowerCase().replace(/[^a-z0-9]+/g, ""); }
  function buildColumnName(rawPath) {
    const segs = rawPath.split(".");
    const root = segs[0];
    const prefix = ROOT_SECTION[root] || "9_Khac";
    const abbr = CONTAINER_ABBR[root];
    let rest = segs;
    if (abbr === null) rest = segs.slice(1);
    else if (typeof abbr === "string") rest = [abbr, ...segs.slice(1)];
    rest = rest.filter((s) => s !== "b"); // .b là ô giá trị % trong "vung", không cần hiện riêng
    const slug = rest.map(slugSegment).filter(Boolean).join("_");
    return `${prefix}_${slug || slugSegment(root)}`;
  }

  // Bản tóm tắt: mỗi dòng 1 lần khám, chỉ các cột cốt lõi hay dùng để lọc/thống kê nhanh
  async function exportExcelTomTat() {
    const groups = await api(`/export/raw${searchFilters.benh ? `?benh=${searchFilters.benh}` : ""}`);
    const headers = ["benh", "maLuuTru", "maBN", "hoTen", "gioiTinh", "namSinh", "ngaySinh", "danToc", "diaChi", "sdt", "lanKham", "ngay", "saltScore", "mucDoNang", "dieuTri"];
    const rows = [];
    for (const { benh, maBN, case: c, patient: p } of groups) {
      const isAA = benh === "AA"; // SALT chỉ áp dụng cho AA, các bệnh khác để trống thay vì hiện số gây hiểu nhầm
      const saltT0 = isAA ? calcSalt(c.benhAnMoi?.vung || {}) : null;
      rows.push([benh, c.maLuuTru, maBN, p?.hoTen || "", p?.gioiTinh || "", p?.namSinh || "", p?.ngaySinh || "", p?.danToc || "", p?.diaChi || "", p?.sdt || "", "T0", c.ngayTao, isAA ? fmt(saltT0) : "", isAA ? mucDoSauDieuChinh(saltT0, c.benhAnMoi?.yeuToNangBac) : "", c.benhAnMoi?.dieuTri || ""]);
      (c.taiKhams || []).forEach((tk, i) => {
        const s = isAA ? calcSalt(tk.vung || {}) : null;
        rows.push([benh, c.maLuuTru, maBN, p?.hoTen || "", p?.gioiTinh || "", p?.namSinh || "", p?.ngaySinh || "", p?.danToc || "", p?.diaChi || "", p?.sdt || "", `Tái khám ${i + 1}`, tk.ngayKham, isAA ? fmt(s) : "", isAA ? mucDoSauDieuChinh(s, tk.yeuToNangBac) : "", tk.dieuTri || ""]);
      });
    }
    downloadXlsx("Tóm tắt", headers, rows, "tomtat.xlsx");
  }

  // Bản đầy đủ theo LẦN KHÁM: mỗi dòng 1 lần khám, cột đặt tên theo quy ước mục_trường
  async function exportExcelDayDuTheoLanKham() {
    const groups = await api(`/export/raw${searchFilters.benh ? `?benh=${searchFilters.benh}` : ""}`);
    const baseCols = ["benh", "maLuuTru", "maBN", "hoTen", "gioiTinh", "namSinh", "ngaySinh", "danToc", "diaChi", "sdt", "lanKham", "ngay"];
    const records = [];
    for (const { benh, maBN, case: c, patient: p } of groups) {
      records.push({ base: [benh, c.maLuuTru, maBN, p?.hoTen || "", p?.gioiTinh || "", p?.namSinh || "", p?.ngaySinh || "", p?.danToc || "", p?.diaChi || "", p?.sdt || "", "T0", c.ngayTao], flat: flattenRecord(c.benhAnMoi, "", {}) });
      (c.taiKhams || []).forEach((tk, i) => {
        records.push({ base: [benh, c.maLuuTru, maBN, p?.hoTen || "", p?.gioiTinh || "", p?.namSinh || "", p?.ngaySinh || "", p?.danToc || "", p?.diaChi || "", p?.sdt || "", `Tái khám ${i + 1}`, tk.ngayKham], flat: flattenRecord(tk, "", {}) });
      });
    }
    const rawKeysSet = new Set();
    records.forEach((r) => Object.keys(r.flat).forEach((k) => rawKeysSet.add(k)));
    const rawKeys = Array.from(rawKeysSet).sort((a, b) => buildColumnName(a).localeCompare(buildColumnName(b)));
    const headers = [...baseCols, ...rawKeys.map(buildColumnName)];
    const rows = records.map((r) => [...r.base, ...rawKeys.map((k) => r.flat[k] ?? "")]);
    downloadXlsx("Đầy đủ theo lần khám", headers, rows, "daydu_theolankham.xlsx");
  }

  // Bản đầy đủ theo BỆNH NHÂN (wide): mỗi dòng 1 bệnh nhân, cột T0_/T1_/T2_... theo từng lần khám
  async function exportExcelDayDuTheoBenhNhan() {
    const groups = await api(`/export/raw${searchFilters.benh ? `?benh=${searchFilters.benh}` : ""}`);
    const perPatient = [];
    let maxVisits = 0;
    for (const { benh, maBN, case: c, patient: p } of groups) {
      const visits = [flattenRecord(c.benhAnMoi, "", {}), ...(c.taiKhams || []).map((tk) => flattenRecord(tk, "", {}))];
      maxVisits = Math.max(maxVisits, visits.length);
      perPatient.push({ benh, maBN, hoTen: p?.hoTen || "", gioiTinh: p?.gioiTinh || "", namSinh: p?.namSinh || "", ngaySinh: p?.ngaySinh || "", danToc: p?.danToc || "", diaChi: p?.diaChi || "", sdt: p?.sdt || "", maHoSo: c.maLuuTru, visits });
    }
    const rawKeysPerSlot = [];
    for (let i = 0; i < maxVisits; i++) {
      const set = new Set();
      perPatient.forEach((pp) => { if (pp.visits[i]) Object.keys(pp.visits[i]).forEach((k) => set.add(k)); });
      rawKeysPerSlot.push(Array.from(set).sort((a, b) => buildColumnName(a).localeCompare(buildColumnName(b))));
    }
    const headers = ["benh", "maBN", "hoTen", "gioiTinh", "namSinh", "ngaySinh", "danToc", "diaChi", "sdt", "maHoSo"];
    for (let i = 0; i < maxVisits; i++) {
      const tPrefix = "T" + i;
      rawKeysPerSlot[i].forEach((k) => headers.push(`${tPrefix}_${buildColumnName(k)}`));
    }
    const rows = perPatient.map((pp) => {
      const row = [pp.benh, pp.maBN, pp.hoTen, pp.gioiTinh, pp.namSinh, pp.ngaySinh, pp.danToc, pp.diaChi, pp.sdt, pp.maHoSo];
      for (let i = 0; i < maxVisits; i++) rawKeysPerSlot[i].forEach((k) => row.push(pp.visits[i]?.[k] ?? ""));
      return row;
    });
    downloadXlsx("Đầy đủ theo bệnh nhân", headers, rows, "daydu_theobenhnhan.xlsx");
  }

  const chartData = aaCase ? [{ name: "T0", salt: fmt(calcSalt(aaCase.benhAnMoi?.vung || {})) }, ...(aaCase.taiKhams || []).map((tk, i) => ({ name: tk.ngayKham || `TK${i + 1}`, salt: fmt(calcSalt(tk.vung || {})) }))] : [];

      </div>
      {currentDisease === "aga"
        ? <AGAFollowUpForm initial={aaCase.taiKhams[editIdx]} onDraftChange={(v) => { draftRef.current = v; }} patientGioiTinh={patient.gioiTinh} onSave={saveFollowUp} onCancel={() => { setEditIdx(null); setView("timeline"); }} uploadImage={uploadImage} />
        : currentDisease === "nonscar"
        ? <NonScarFollowUpForm initial={aaCase.taiKhams[editIdx]} onDraftChange={(v) => { draftRef.current = v; }} onSave={saveFollowUp} onCancel={() => { setEditIdx(null); setView("timeline"); }} uploadImage={uploadImage} />
        : <FollowUpForm initial={aaCase.taiKhams[editIdx]} onDraftChange={(v) => { draftRef.current = v; }} saltT0={calcSalt(aaCase.benhAnMoi?.vung || {})} onSave={saveFollowUp} onCancel={() => { setEditIdx(null); setView("timeline"); }} uploadImage={uploadImage} />}
    </div>}
  </div></FieldMetaProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
